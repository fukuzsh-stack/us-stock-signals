name: daily-signals

on:
  schedule:
    # 火〜土の 22:30 UTC = 日本時間 7:30(米国市場の終了後)
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}   # スマホのGitHubアプリ/ブラウザから手動実行もできる

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-signals
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compute signals
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m signals.main
      - name: Commit results
        run: |
          git config user.name "signals-bot"
          git config user.email "signals-bot@users.noreply.github.com"
          git add docs/data cache
          git diff --cached --quiet || git commit -m "signals: $(date -u +%F)"
          # 途中で別の更新が入っていても、今回の結果を優先して取り込む
          git fetch origin main
          git rebase -X theirs origin/main
          git push origin HEAD:main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  # 公開だけが失敗した場合も、この job だけをやり直せるよう分けている
  deploy:
    needs: run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
